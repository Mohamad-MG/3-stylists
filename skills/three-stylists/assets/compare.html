<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 Stylists</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ground: #0e0e0d;
    --panel: #161615;
    --rule: #2a2a28;
    --ink: #ecebe6;
    --muted: #8d8b84;
    --accent: #d8c49a;
    --radius: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
    min-height: 100vh;
  }
  :lang(ar) body { line-height: 1.7; }

  header {
    position: sticky; inset-block-start: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
    padding: 14px 24px;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(8px);
    border-block-end: 1px solid var(--rule);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-inline-end: auto; }
  .brand b { font-size: 16px; font-weight: 600; letter-spacing: 0; }
  .brand span { color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; }
  .seg {
    display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px;
  }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; padding: 5px 14px; border-radius: 999px; cursor: pointer;
    transition: background-color 160ms cubic-bezier(0.22, 1, 0.36, 1), color 160ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .seg button:focus-visible, .pick:focus-visible, .open:focus-visible, .tab:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  main { padding: 24px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid.focus { grid-template-columns: minmax(0, 1fr); }
  .grid.focus .panel:not(.active) { display: none; }
  @media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .tabs { display: none; gap: 8px; margin-block-end: 16px; }
  .tabs.show { display: flex; }
  .tab {
    appearance: none; font: inherit; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--rule); border-radius: 999px; padding: 6px 16px;
  }
  .tab[aria-selected="true"] { color: var(--ground); background: var(--accent); border-color: var(--accent); }

  .panel {
    background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .panel-head {
    display: flex; align-items: baseline; gap: 10px; padding: 14px 16px;
    border-block-end: 1px solid var(--rule);
  }
  .panel-head .n { color: var(--accent); font-variant-numeric: tabular-nums; }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .panel-head p { margin: 0; color: var(--muted); font-size: 13px; margin-inline-start: auto; text-align: end; }
  .panel-head .engine {
    font-size: 12px; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px;
    direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums;
  }
  .missing { align-self: center; color: var(--accent); font-size: 13px; }

  .stage { position: relative; background: #000; overflow: hidden; }
  .stage.mobile { display: flex; justify-content: center; background: #0a0a0a; padding-block: 16px; }
  .frame { position: absolute; inset-block-start: 0; inset-inline-start: 0; border: 0; transform-origin: top left; background: #fff; }
  [dir="rtl"] .frame { transform-origin: top right; }
  .stage.mobile .frame { position: relative; inset: auto; border-radius: 22px; box-shadow: 0 0 0 1px var(--rule); }
  .stage.mobile .frame-holder { position: relative; }

  .panel-foot { display: flex; gap: 8px; padding: 12px 16px; border-block-start: 1px solid var(--rule); }
  .open, .pick {
    font: inherit; text-decoration: none; cursor: pointer;
    border-radius: 999px; padding: 6px 14px; border: 1px solid var(--rule);
  }
  .open { color: var(--ink); background: transparent; }
  .pick { color: var(--ground); background: var(--ink); border-color: var(--ink); margin-inline-start: auto; }

  .toast {
    position: fixed; inset-block-end: 24px; inset-inline-start: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--ground); padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms cubic-bezier(0.22, 1, 0.36, 1), transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  [dir="rtl"] .toast { transform: translateX(50%) translateY(12px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [dir="rtl"] .toast.show { transform: translateX(50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><b>3 Stylists</b><span id="run-name"></span></div>
  <div class="controls">
    <div class="seg" role="group" id="g-lang" aria-label="Language">
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <div class="seg" role="group" id="g-view" aria-label="Viewport">
      <button type="button" data-view="desktop" data-i18n="desktop"></button>
      <button type="button" data-view="mobile" data-i18n="mobile"></button>
    </div>
    <div class="seg" role="group" id="g-layout" aria-label="Layout">
      <button type="button" data-layout="side" data-i18n="side"></button>
      <button type="button" data-layout="focus" data-i18n="focus"></button>
    </div>
  </div>
</header>

<main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var UI = {
    ar: { desktop: 'ديسكتوب', mobile: 'موبايل', side: 'جنب بعض', focus: 'واحدة واحدة', open: 'افتح', pick: 'اختار دي',
          notes: 'ملاحظات الستايلست', missing: 'الصفحة دي مش موجودة', degraded: 'شغال ناقص',
          copied: 'اتنسخ — الصقه لـ Claude', pickText: function (id) { return '3 Stylists: اخترت نسخة "' + id + '"'; } },
    en: { desktop: 'Desktop', mobile: 'Mobile', side: 'Side by side', focus: 'One at a time', open: 'Open', pick: 'Pick this',
          notes: "Stylist's notes", missing: 'This page is missing', degraded: 'degraded',
          copied: 'Copied — paste it to Claude', pickText: function (id) { return '3 Stylists: I pick "' + id + '"'; } }
  };

  var VIEWPORTS = { desktop: { w: 1440, h: 900 }, mobile: { w: 390, h: 844 } };
  var DEFAULT_VARIANTS = [
    { id: 'atelier', title: 'Atelier' },
    { id: 'manifesto', title: 'Manifesto' },
    { id: 'cinema', title: 'Cinema' }
  ];

  var state = { lang: 'ar', view: 'desktop', layout: 'side', active: 0, variants: DEFAULT_VARIANTS, run: null };
  var grid = document.getElementById('grid');
  var tabs = document.getElementById('tabs');
  var observers = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function tagline(v) {
    var t = (v.manifest && v.manifest.tagline) || v.tagline;
    if (!t) return '';
    return typeof t === 'string' ? t : (t[state.lang] || '');
  }

  // Each stylist declares its pages in <id>/stylist.json, so every engine keeps its own layout.
  function src(v) {
    var pages = v.manifest && v.manifest.pages;
    if (pages && pages[state.lang]) return v.id + '/' + pages[state.lang];
    return 'about:blank';
  }

  function engineLabel(v) {
    var m = v.manifest;
    if (!m || !m.engine) return '';
    var s = m.engine + (m.commit ? ' @ ' + String(m.commit).slice(0, 7) : '');
    if (m.degraded && m.degraded.length) s += ' · ' + (UI[state.lang] || UI.en).degraded + ': ' + m.degraded.join(', ');
    return s;
  }

  function fit(stage, holder, frame) {
    var vp = VIEWPORTS[state.view];
    var available = stage.clientWidth - (state.view === 'mobile' ? 32 : 0);
    // Desktop never renders narrower than 1440px; wider stages show the page at their real width.
    var w = state.view === 'desktop' ? Math.max(vp.w, available) : vp.w;
    frame.style.width = w + 'px';
    frame.style.height = vp.h + 'px';
    var scale = Math.min(1, available / w);
    frame.style.transform = 'scale(' + scale + ')';
    if (state.view === 'mobile') {
      frame.style.transformOrigin = 'top center';
      holder.style.width = vp.w * scale + 'px';
      holder.style.height = vp.h * scale + 'px';
      frame.style.position = 'absolute';
      frame.style.insetInlineStart = (vp.w * scale - vp.w) / 2 + 'px';
      stage.style.height = vp.h * scale + 32 + 'px';
    } else {
      frame.style.transformOrigin = '';
      frame.style.position = '';
      frame.style.insetInlineStart = '';
      holder.style.width = '';
      holder.style.height = '';
      stage.style.height = vp.h * scale + 'px';
    }
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function copy(text) {
    var done = function () { toast(UI[state.lang].copied); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { prompt('', text); });
    } else {
      prompt('', text);
    }
  }

  function render() {
    var ui = UI[state.lang];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = ui[n.getAttribute('data-i18n')]; });
    document.querySelectorAll('#g-lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)); });
    document.querySelectorAll('#g-view button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === state.view)); });
    document.querySelectorAll('#g-layout button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layout === state.layout)); });
    document.getElementById('run-name').textContent = state.run && state.run.name ? state.run.name : '';

    observers.forEach(function (o) { o.disconnect(); });
    observers = [];
    grid.textContent = '';
    tabs.textContent = '';
    grid.classList.toggle('focus', state.layout === 'focus');
    tabs.classList.toggle('show', state.layout === 'focus');

    state.variants.forEach(function (v, i) {
      var tab = el('button', 'tab', v.title);
      tab.type = 'button';
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', String(i === state.active));
      tab.addEventListener('click', function () { state.active = i; render(); });
      tabs.appendChild(tab);

      var panel = el('section', 'panel' + (i === state.active ? ' active' : ''));
      var head = el('div', 'panel-head');
      head.appendChild(el('span', 'n', String(i + 1).padStart(2, '0')));
      head.appendChild(el('h2', null, v.title));
      if (engineLabel(v)) head.appendChild(el('span', 'engine', engineLabel(v)));
      head.appendChild(el('p', null, tagline(v)));

      var stage = el('div', 'stage' + (state.view === 'mobile' ? ' mobile' : ''));
      var holder = el('div', 'frame-holder');
      var frame = el('iframe', 'frame');
      frame.title = v.title;
      frame.loading = 'lazy';
      frame.src = src(v);
      holder.appendChild(frame);
      stage.appendChild(holder);

      var foot = el('div', 'panel-foot');
      var open = el('a', 'open', ui.open);
      open.href = src(v);
      open.target = '_blank';
      open.rel = 'noopener';
      var pick = el('button', 'pick', ui.pick);
      pick.type = 'button';
      pick.addEventListener('click', function () { copy(ui.pickText(v.id)); });
      foot.appendChild(open);
      if (v.manifest && v.manifest.notes) {
        var notes = el('a', 'open', ui.notes);
        notes.href = v.id + '/' + v.manifest.notes;
        notes.target = '_blank';
        notes.rel = 'noopener';
        foot.appendChild(notes);
      }
      if (!v.manifest || !v.manifest.pages || !v.manifest.pages[state.lang]) {
        foot.appendChild(el('span', 'missing', ui.missing));
      }
      foot.appendChild(pick);

      panel.appendChild(head);
      panel.appendChild(stage);
      panel.appendChild(foot);
      grid.appendChild(panel);

      var ro = new ResizeObserver(function () { fit(stage, holder, frame); });
      ro.observe(stage);
      observers.push(ro);
    });
  }

  document.getElementById('g-lang').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.dataset.lang === state.lang) return;
    state.lang = b.dataset.lang; render();
  });
  document.getElementById('g-view').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view; render();
  });
  document.getElementById('g-layout').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.layout = b.dataset.layout; render();
  });

  function getJSON(url) {
    return fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  getJSON('run.json').then(function (run) {
    if (run) {
      state.run = run;
      if (Array.isArray(run.variants) && run.variants.length) state.variants = run.variants;
      var lead = run.lead || run.primary;
      if (lead === 'en' || lead === 'ar') state.lang = lead;
    }
    var q = new URLSearchParams(location.search);
    if (q.get('lang') === 'ar' || q.get('lang') === 'en') state.lang = q.get('lang');
    return Promise.all(state.variants.map(function (v) {
      return getJSON(v.id + '/stylist.json').then(function (m) { v.manifest = m; });
    }));
  }).then(render);
})();
</script>
</body>
</html>
