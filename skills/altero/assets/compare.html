<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altero</title>
<!--
  Altero showcase. One direction at a time, at full size, in tabs.
  Reads run.json (the variants, the lead language) and each <id>/stylist.json (the pages, the tagline, the notes).
  A variant whose page is not ready shows "Building" and appears by itself when its manifest lands.
  Keys: left and right arrows or 1-9 switch tabs, D and M switch desktop and phone.
-->
<style>
  :root {
    --ink: #0d0d0d; --bar: #141414; --line: #2a2a2a; --paper: #f4f3ef; --muted: #9a9890;
    --accent: #f2660f; --stage: #1b1b1b;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 10px 18px; background: var(--bar); border-block-end: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .brand span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--ink); border: 1px solid var(--line); border-radius: 999px; }
  .tab { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 999px; font-weight: 600; white-space: nowrap; transition: background .2s var(--ease), color .2s var(--ease); }
  .tab:hover { color: var(--paper); }
  .tab[aria-selected="true"] { background: var(--paper); color: var(--ink); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .tab .dot.ready { background: #3ecf8e; }
  .tab .dot.base { background: var(--accent); }
  .tab .dot.building { background: #e8b931; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .controls { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; }
  .seg button[aria-pressed="true"] { background: #2c2c2c; color: var(--paper); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; padding: 7px 14px; border-radius: 999px; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: #444; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  .btn[hidden], .seg[hidden] { display: none; }

  .info { display: flex; align-items: center; gap: 14px; padding: 8px 18px; color: var(--muted); border-block-end: 1px solid var(--line); min-height: 38px; }
  .info strong { color: var(--paper); font-weight: 600; }
  .info .engine { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .info .tagline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info a { color: var(--paper); margin-inline-start: auto; white-space: nowrap; }

  .stage { position: relative; background: var(--stage); overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; animation: in .28s var(--ease); }
  @keyframes in { from { opacity: 0; } }
  .holder { position: absolute; overflow: hidden; background: #fff; }
  .holder iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
  .phone .holder { border-radius: 28px; box-shadow: 0 0 0 10px #050505, 0 0 0 11px #333, 0 30px 80px rgba(0,0,0,.5); }
  .waiting { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; color: var(--muted); }
  .waiting b { color: var(--paper); font-size: 18px; }
  .waiting i { width: 44px; height: 4px; margin: 0 auto; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 200% 100%; animation: sweep 1.2s linear infinite; }
  @keyframes sweep { to { background-position: -200% 0; } }

  .toast { position: fixed; inset-block-end: 20px; inset-inline-start: 50%; transform: translate(-50%, 12px); background: var(--paper); color: var(--ink); padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); font-weight: 600; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) {
    .bar { grid-template-columns: 1fr; justify-items: center; }
    .brand, .controls { justify-content: center; }
    .tabs { max-width: 100%; overflow-x: auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>Altero</b><span id="run-name"></span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Directions"></nav>
  <div class="controls">
    <div class="seg" id="g-view" role="group" aria-label="Viewport">
      <button type="button" data-view="desktop" data-i18n="desktop"></button>
      <button type="button" data-view="mobile" data-i18n="mobile"></button>
    </div>
    <div class="seg" id="g-lang" role="group" aria-label="Language" hidden>
      <button type="button" data-lang="ar">ع</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <a class="btn" id="open" target="_blank" rel="noopener" data-i18n="open"></a>
    <button class="btn primary" id="pick" type="button" data-i18n="pick"></button>
  </div>
</header>
<div class="info" id="info"></div>
<main class="stage" id="stage"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var UI = {
    ar: { desktop: 'ديسكتوب', mobile: 'موبايل', open: 'افتح', pick: 'اختار الاتجاه ده', notes: 'ملاحظات الستايلست',
          building: 'جاري البناء', buildingHint: 'هيظهر هنا أول ما يخلص', missingLang: 'الاتجاه ده مالوش صفحة باللغة دي',
          copied: 'اتنسخ، الصقه في المحادثة', current: 'موقعك الحالي، نسخة واجهة بس',
          pickText: function (id) { return 'Altero: اخترت "' + id + '"'; } },
    en: { desktop: 'Desktop', mobile: 'Phone', open: 'Open', pick: 'Pick this direction', notes: "Stylist's notes",
          building: 'Building', buildingHint: 'It appears here as soon as it is done', missingLang: 'This direction has no page in this language',
          copied: 'Copied, paste it in the chat', current: 'Your current site, front end only',
          pickText: function (id) { return 'Altero: I pick "' + id + '"'; } }
  };
  var VIEWPORTS = { desktop: { w: 1440, h: 900 }, mobile: { w: 390, h: 844 } };
  var DEFAULT_VARIANTS = [
    { id: 'atelier', title: 'Atelier' },
    { id: 'manifesto', title: 'Manifesto' },
    { id: 'cinema', title: 'Cinema' }
  ];

  var state = { lang: 'en', view: 'desktop', active: 0, variants: DEFAULT_VARIANTS, run: null };
  var views = {};
  var stage = document.getElementById('stage');
  var $ = function (id) { return document.getElementById(id); };
  var ui = function () { return UI[state.lang] || UI.en; };

  function anyPage(v) { var p = v.manifest && v.manifest.pages; return !!(p && (p.ar || p.en)); }
  function srcOf(v) { var p = v.manifest && v.manifest.pages; return p && p[state.lang] ? v.id + '/' + p[state.lang] : null; }
  function text(t) { return !t ? '' : typeof t === 'string' ? t : (t[state.lang] || t.en || t.ar || ''); }

  // Desktop renders the page at 1440 wide (or wider) scaled to the stage width, filling the stage's height.
  // Phone renders 390 wide in a device frame, scaled to fit the stage.
  function fit(view) {
    var holder = view.holder, frame = view.frame;
    if (!frame) return;
    var W = stage.clientWidth, H = stage.clientHeight;
    if (state.view === 'mobile') {
      var vp = VIEWPORTS.mobile, s = Math.min(1, (H - 48) / vp.h, (W - 48) / vp.w);
      frame.style.width = vp.w + 'px'; frame.style.height = vp.h + 'px';
      frame.style.transform = 'scale(' + s + ')';
      holder.style.width = vp.w * s + 'px'; holder.style.height = vp.h * s + 'px';
      holder.style.left = (W - vp.w * s) / 2 + 'px'; holder.style.top = (H - vp.h * s) / 2 + 'px';
    } else {
      var w = Math.max(VIEWPORTS.desktop.w, W), k = W / w;
      frame.style.width = w + 'px'; frame.style.height = H / k + 'px';
      frame.style.transform = 'scale(' + k + ')';
      holder.style.width = W + 'px'; holder.style.height = H + 'px'; holder.style.left = '0'; holder.style.top = '0';
    }
    view.el.classList.toggle('phone', state.view === 'mobile');
  }

  // One view per variant, language and viewport, kept alive so switching tabs is instant.
  function ensureView(v) {
    var key = v.id + '|' + state.lang + '|' + state.view;
    var view = views[key];
    var src = srcOf(v);
    if (view && view.src === src) return view;
    if (view) view.el.remove();
    var el = document.createElement('section');
    el.className = 'view';
    view = { el: el, src: src, holder: null, frame: null };
    if (src) {
      var holder = document.createElement('div');
      holder.className = 'holder';
      var frame = document.createElement('iframe');
      frame.title = v.title;
      frame.src = src;
      holder.appendChild(frame);
      el.appendChild(holder);
      view.holder = holder; view.frame = frame;
    } else {
      var w = document.createElement('div');
      w.className = 'waiting';
      var building = !anyPage(v);
      w.innerHTML = '<b></b><span></span>' + (building ? '<i></i>' : '');
      w.querySelector('b').textContent = building ? ui().building : v.title;
      w.querySelector('span').textContent = building ? ui().buildingHint : ui().missingLang;
      el.appendChild(w);
    }
    stage.appendChild(el);
    views[key] = view;
    return view;
  }

  function renderTabs() {
    var tabs = $('tabs');
    tabs.textContent = '';
    state.variants.forEach(function (v, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(i === state.active));
      var dot = document.createElement('span');
      dot.className = 'dot ' + (v.id === 'base' ? 'base' : anyPage(v) ? 'ready' : 'building');
      b.appendChild(dot);
      b.appendChild(document.createTextNode(v.title));
      b.addEventListener('click', function () { select(i); });
      tabs.appendChild(b);
    });
  }

  function renderInfo(v) {
    var info = $('info');
    info.textContent = '';
    var name = document.createElement('strong'); name.textContent = v.title; info.appendChild(name);
    var m = v.manifest || {};
    if (v.id !== 'base' && m.engine) {
      var e = document.createElement('span'); e.className = 'engine';
      e.textContent = m.engine + (m.commit ? ' @ ' + String(m.commit).slice(0, 7) : '');
      info.appendChild(e);
    }
    var t = document.createElement('span'); t.className = 'tagline';
    t.textContent = v.id === 'base' ? ui().current : text(m.tagline);
    info.appendChild(t);
    if (m.notes && v.id !== 'base') {
      var a = document.createElement('a'); a.href = v.id + '/' + m.notes; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = ui().notes; info.appendChild(a);
    }
  }

  function render() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = ui()[n.getAttribute('data-i18n')]; });
    document.querySelectorAll('#g-view button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === state.view)); });
    document.querySelectorAll('#g-lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)); });
    // The current site is one language; offer the switch only when a direction has both.
    var bilingual = state.variants.some(function (v) { var p = v.id !== 'base' && v.manifest && v.manifest.pages; return p && p.ar && p.en; });
    $('g-lang').hidden = !bilingual;
    $('run-name').textContent = state.run && state.run.name ? state.run.name : '';

    var v = state.variants[state.active];
    renderTabs();
    renderInfo(v);
    Object.keys(views).forEach(function (k) { views[k].el.classList.remove('active'); });
    var view = ensureView(v);
    view.el.classList.add('active');
    fit(view);

    var src = srcOf(v);
    $('open').hidden = !src;
    if (src) $('open').href = src;
    $('pick').hidden = v.id === 'base' || !src;
    history.replaceState(null, '', '#' + v.id + '/' + state.view + '/' + state.lang);
  }

  function select(i) {
    state.active = (i + state.variants.length) % state.variants.length;
    render();
  }

  $('g-view').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.view = b.dataset.view; render(); } });
  $('g-lang').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.lang = b.dataset.lang; render(); } });
  $('pick').addEventListener('click', function () {
    var copyText = ui().pickText(state.variants[state.active].id);
    var done = function () { var t = $('toast'); t.textContent = ui().copied; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 2200); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(copyText).then(done, function () { prompt('', copyText); });
    else prompt('', copyText);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    var rtl = state.lang === 'ar';
    if (e.key === 'ArrowRight') select(state.active + (rtl ? -1 : 1));
    else if (e.key === 'ArrowLeft') select(state.active + (rtl ? 1 : -1));
    else if (/^[1-9]$/.test(e.key) && +e.key <= state.variants.length) select(+e.key - 1);
    else if (e.key === 'd' || e.key === 'D') { state.view = 'desktop'; render(); }
    else if (e.key === 'm' || e.key === 'M') { state.view = 'mobile'; render(); }
  });
  new ResizeObserver(function () {
    var v = state.variants[state.active];
    var view = views[v.id + '|' + state.lang + '|' + state.view];
    if (view) fit(view);
  }).observe(stage);

  function getJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  getJSON('run.json').then(function (run) {
    if (run) {
      state.run = run;
      if (Array.isArray(run.variants) && run.variants.length) state.variants = run.variants;
      var lead = run.lead || run.primary;
      if (lead === 'en' || lead === 'ar') state.lang = lead;
    }
    var h = location.hash.slice(1).split('/');
    var at = state.variants.findIndex(function (v) { return v.id === h[0]; });
    if (at >= 0) state.active = at;
    if (h[1] === 'mobile' || h[1] === 'desktop') state.view = h[1];
    if (h[2] === 'ar' || h[2] === 'en') state.lang = h[2];
    return Promise.all(state.variants.map(function (v) { return getJSON(v.id + '/stylist.json').then(function (m) { v.manifest = m; }); }));
  }).then(render).then(function () {
    // Stylists finish at different times: pick up their pages as they land, without a reload.
    var polls = 0;
    var timer = setInterval(function () {
      polls += 1;
      var waiting = state.variants.filter(function (v) { return !anyPage(v); });
      if (!waiting.length || polls > 360) { clearInterval(timer); return; }
      Promise.all(waiting.map(function (v) {
        return getJSON(v.id + '/stylist.json').then(function (m) { if (m) v.manifest = m; return !!(m && m.pages); });
      })).then(function (found) { if (found.some(Boolean)) render(); });
    }, 5000);
  });
})();
</script>
</body>
</html>
